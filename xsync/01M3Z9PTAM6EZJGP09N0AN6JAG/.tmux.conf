# Version: 03-10-26
# ─── tmux.conf ────────────────────────────────────────────────────────────────
# Sensible defaults for use inside Ghostty (or any modern terminal).
# Location: ~/.tmux.conf
#
# Install tmux plugin manager (tpm) for the theme:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then inside tmux press: prefix + I  (capital i) to install plugins.
# ──────────────────────────────────────────────────────────────────────────────

# ── Prefix key ────────────────────────────────────────────────────────────────
# Change from the default ctrl+b to ctrl+z
unbind C-b
set -g prefix C-z
bind C-z send-prefix          # ctrl+z ctrl+z sends a literal ctrl+z

# ── Terminal & colour ─────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"            # true-colour passthrough
set -as terminal-overrides ",*:RGB"           # also covers ghostty
set -as terminal-features ",*:hyperlinks"     # OSC 8 hyperlinks

# ── General behaviour ─────────────────────────────────────────────────────────
set -g mouse on                # click to select pane/window, scroll with wheel
set -g history-limit 50000     # keep 50k lines of scrollback per pane
set -g base-index 1            # windows start at 1 (easier to reach on keyboard)
setw -g pane-base-index 1      # panes also start at 1
set -g renumber-windows on     # close window 2 of 1,2,3 → windows become 1,2
set -sg escape-time 0          # no delay after pressing Escape (important for vim/nvim)
set -g word-separators " @!#$%^&*()+=[]{}|;:',<>?\\\"`~"  # exclude - and . so steve-vine, file.txt and 192.168.1.1 select as one word
set -g focus-events on         # pass focus events through to apps (vim autoread etc.)
set -g display-time 2000       # status messages visible for 2 seconds
set -g set-titles on           # allow tmux to set the terminal title
set -g set-titles-string "#W"  # set title to current window name

# ── Reload config ─────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ── Window management ─────────────────────────────────────────────────────────
bind w new-window -c "#{pane_current_path}"
bind x confirm-before -p "Close window? (y/n)" kill-window
bind n command-prompt -I "#W" "rename-window '%%'"
bind . next-window
bind , previous-window
bind < swap-window -t -1 \; previous-window   # move window left
bind > swap-window -t +1 \; next-window        # move window right
unbind c

# Select windows without prefix
bind -n M-q previous-window
bind -n M-w next-window

# ── Pane splits ───────────────────────────────────────────────────────────────
bind Right split-window -h  -c "#{pane_current_path}"   # new pane to the right
bind Left  split-window -hb -c "#{pane_current_path}"   # new pane to the left
bind Down  split-window -v  -c "#{pane_current_path}"   # new pane below
bind Up    split-window -vb -c "#{pane_current_path}"   # new pane above
unbind '"'
unbind %

# ── Pane navigation (vim-style h/j/k/l) ──────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Shift+arrow keys to navigate panes without prefix
bind -n S-Left  select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up    select-pane -U
bind -n S-Down  select-pane -D

# ── Pane resizing ─────────────────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -n S-C-Left  resize-pane -L 5
bind -n S-C-Right resize-pane -R 5
bind -n S-C-Up    resize-pane -U 5
bind -n S-C-Down  resize-pane -D 5

# ── Copy mode (vi keys) ───────────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode             # prefix+enter enters copy/scroll mode
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# Scroll 2 lines at a time with the mouse wheel
bind -T copy-mode-vi WheelUpPane   send -X scroll-up
bind -T copy-mode-vi WheelUpPane   send -X scroll-up
bind -T copy-mode-vi WheelDownPane send -X scroll-down
bind -T copy-mode-vi WheelDownPane send -X scroll-down

# Mouse drag to select + auto-copy to clipboard
bind -n MouseDrag1Pane copy-mode -M
bind -T copy-mode-vi MouseDrag1Pane    send -X begin-selection
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ── Summon popup shortcut ─────────────────────────────────────────────────────
# Press prefix+S (capital) to open summon in a floating popup from anywhere.
# (sp in the shell still works too — this is a bonus direct binding.)
bind S display-popup \
  -d "#{pane_current_path}" \
  -w 90% -h 90% \
  -E "scriptpicker"

# ── Session management ────────────────────────────────────────────────────────
bind s choose-tree -Zs                                                         # session picker
bind N command-prompt -p "New session name:" "new-session -s '%%'"             # new named session
bind R command-prompt -I "#S" -p "Rename session:" "rename-session '%%'"       # rename current session

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 60
set -g status-style "bg=#2a3e5d,fg=#f2f3f8"

# Left: icon → session name
set -g status-left-length 60
set -g status-left "#[bg=#ffffff,fg=#1e1e2e,bold]  #[fg=#ffffff,bg=#48626a]#[bg=#48626a,fg=#f2f3f8,bold] #S #[bg=#2a3e5d,fg=#48626a]"

# Right: time → hostname
set -g status-right-length 60
set -g status-right "#[bg=#2a3e5d,fg=#48626a]#[bg=#48626a,fg=#f2f3f8] #h/#U #[bg=#48626a,fg=#f2f3f8]#[bg=#f2f3f8,fg=#1e1e2e,bold] %H:%M "

# Window tabs
setw -g window-status-style "fg=#aaaaaa,bg=#2a3e5d"
setw -g window-status-format " #I:#W "
setw -g window-status-current-style "fg=#1e1e2e,bg=#f2f3f8,bold"
setw -g window-status-current-format "#[bg=#f2f3f8,fg=#2a3e5d]#[bg=#f2f3f8,fg=#1e1e2e,bold] #I:#W #[bg=#2a3e5d,fg=#f2f3f8]"

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format " #{pane_current_command} "

# Dim inactive panes
set -g window-style "bg=#11111b"
set -g window-active-style "bg=#1e1e2e"

# ── Plugins (tpm) ─────────────────────────────────────────────────────────────
# Install tpm first if not already done:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then inside tmux: prefix + I  (capital i) to install plugins.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum: auto-save every 15 mins, auto-restore on start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-resurrect: also restore pane contents
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
